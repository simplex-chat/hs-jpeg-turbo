name: build

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.os }}, GHC ${{ matrix.ghc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: 9.6.3
          - os: ubuntu-22.04
            ghc: 8.10.7
          - os: ubuntu-22.04-arm
            ghc: 9.6.3
          - os: ubuntu-24.04-arm
            ghc: 9.6.3
          - os: macos-latest
            ghc: 9.6.3
          - os: macos-15-intel
            ghc: 9.6.3
          - os: windows-latest
            ghc: 9.6.3
    env:
      mozjpeg_cmake: "-DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR:PATH=lib -DBUILD=20250623 -DBUILD_SHARED_LIBS=OFF -DPNG_SUPPORTED=OFF -DWITH_ARITH_DEC=1 -DCMAKE_POSITION_INDEPENDENT_CODE=ON"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Point Command Line Tools SDK to Xcode SDK
        if: runner.os == 'macOS'
        run: sudo ln -sfn "$(xcrun --sdk macosx --show-sdk-path)" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - id: setup
        uses: simplex-chat/setup-haskell-action@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 3.10.2.0

      - uses: actions/cache@v4
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: store-${{ matrix.os }}-ghc${{ matrix.ghc }}-${{ hashFiles('*/*.cabal') }}
          restore-keys: store-${{ matrix.os }}-ghc${{ matrix.ghc }}-

      - name: Select GHC's C compiler (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "ghc_cc=$(ghc --print-libdir)/../mingw/bin/clang.exe" >> "$GITHUB_ENV"
          echo "ghc_ldflags=-fuse-ld=lld --rtlib=compiler-rt" >> "$GITHUB_ENV"

      - name: Show C compiler macros
        env:
          CC: ${{ env.ghc_cc }}
        run: |
          echo > "$RUNNER_TEMP/empty.c"
          "${CC:-cc}" --version
          "${CC:-cc}" -dM -E "$RUNNER_TEMP/empty.c" | grep -E ' (__SIZEOF_SIZE_T__|__SIZEOF_LONG__|__aarch64__|__x86_64__|_WIN32|__APPLE__|__ELF__|__clang__|__GNUC__) '

      - run: cabal build --enable-tests all

      - name: Show Neon symbols in the library
        if: runner.arch == 'ARM64'
        run: |
          lib=$(find dist-newstyle -name 'libHSjpeg-turbo-*.a' -not -name '*_p.a')
          nm -A -g "$lib" | grep -E 'neon\.o.* T _?jsimd_'
          nm -A -g "$lib" | grep -E 'jsimd\.o.* T _?jsimd_can_'

      - run: cabal test --enable-tests --test-show-details=direct all

      - name: Build mozjpeg with CMake (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_ARCH" = X64 ]; then
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update
              sudo apt-get install -y nasm
            else
              brew install nasm
            fi
          fi
          cmake -S jpeg-turbo/cbits/mozjpeg -B "$RUNNER_TEMP/mozjpeg-build" -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/mozjpeg" $mozjpeg_cmake
          cmake --build "$RUNNER_TEMP/mozjpeg-build" --target install --parallel
          echo "MOZJPEG_PREFIX=$RUNNER_TEMP/mozjpeg" >> "$GITHUB_ENV"

      - name: Compare neon-compat.h with the header generated by CMake
        if: runner.arch == 'ARM64'
        run: |
          macros() {
            cc -dM -E -include "$1" -x c /dev/null | sed -n 's/^#define \(HAVE_VLD1[A-Z0-9_]*\).*/\1/p' | sort
          }
          macros jpeg-turbo/cbits/neon-compat.h > "$RUNNER_TEMP/neon-compat-cabal.txt"
          macros "$RUNNER_TEMP/mozjpeg-build/simd/arm/neon-compat.h" > "$RUNNER_TEMP/neon-compat-cmake.txt"
          cat "$RUNNER_TEMP/neon-compat-cmake.txt"
          diff "$RUNNER_TEMP/neon-compat-cabal.txt" "$RUNNER_TEMP/neon-compat-cmake.txt"

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: simplex-chat/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: make
          pacboy: >-
            toolchain:p
            cmake:p
            nasm:p

      - name: Build mozjpeg with CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CC: ${{ env.ghc_cc }}
          LDFLAGS: ${{ env.ghc_ldflags }}
        run: |
          export CC=$(cygpath -m "$CC")
          tmp=$(cygpath -m "$RUNNER_TEMP")
          cmake -S jpeg-turbo/cbits/mozjpeg -B "$tmp/mozjpeg-build" -DCMAKE_INSTALL_PREFIX="$tmp/mozjpeg" $mozjpeg_cmake
          cmake --build "$tmp/mozjpeg-build" --target install --parallel
          echo "MOZJPEG_PREFIX=$tmp/mozjpeg" >> "$GITHUB_ENV"

      - name: Compare JPEGs encoded by the cabal and CMake builds
        env:
          CC: ${{ env.ghc_cc }}
          LDFLAGS: ${{ env.ghc_ldflags }}
        run: bash .github/scripts/output-check.sh

      - name: Report test coverage
        if: matrix.os == 'ubuntu-22.04' && matrix.ghc == '9.6.3'
        run: bash .github/scripts/coverage.sh

  armv7:
    name: armv7 on ubuntu-24.04-arm, Neon and C
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install the armv7 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf
          arm-linux-gnueabihf-gcc --version

      - name: Compare neon-compat.h with the header generated by CMake
        run: |
          flags="-march=armv7-a -mfpu=neon -mfloat-abi=hard"
          cmake -S jpeg-turbo/cbits/mozjpeg -B "$RUNNER_TEMP/mozjpeg-build" -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=arm -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_C_FLAGS="$flags" -DBUILD_SHARED_LIBS=OFF -DPNG_SUPPORTED=OFF
          macros() {
            arm-linux-gnueabihf-gcc $flags -dM -E -include "$1" -x c /dev/null | sed -n 's/^#define \(HAVE_VLD1[A-Z0-9_]*\).*/\1/p' | sort
          }
          macros jpeg-turbo/cbits/neon-compat.h > "$RUNNER_TEMP/neon-compat-cabal.txt"
          macros "$RUNNER_TEMP/mozjpeg-build/simd/arm/neon-compat.h" > "$RUNNER_TEMP/neon-compat-cmake.txt"
          cat "$RUNNER_TEMP/neon-compat-cmake.txt"
          diff "$RUNNER_TEMP/neon-compat-cabal.txt" "$RUNNER_TEMP/neon-compat-cmake.txt"

      - name: Compare JPEGs encoded with Neon and with the C code paths
        run: bash .github/scripts/armv7-check.sh

      - name: Compare PNGs decoded by the armv7 and aarch64 builds
        run: bash .github/scripts/png-check.sh
